<body><script>
page({id:'0.0', new:['D1','D2','A1','T1'],
moves:[
 {who:'P', tag:'thesis', say:'The world is astonishingly simple — and so is life. Every problem you or I face is simple too.',
  f:'claim: world simple ∧ life simple',
  pic:G({w:[0,0,'World: simple','act'], l:[1.3,0,'Life: simple','act']}, [['w','l','and','n']])},
 {who:'Y', tag:'objection', say:'That’s only a child’s view. Children are protected and blindfolded. Grow up, and the world shows its real face: impossibility, cruel realism.',
  f:'simple = child’s illusion?   adult ⇒ complicated',
  pic:G({c:[0,0,'Child: protected,\nblindfolded','x',170], s:[1.4,0,'“World is\nsimple”','x'], a:[0,1,'Adult: sees\nreality','me'], k:[1.4,1,'“World is\ncomplicated”','bad']}, [['c','s'],['a','k']])},
 {who:'Y', tag:'claim', say:'The world is complicated: duties, war, inequality, and no religion left to lean on.',
  f:'claim: “complicated” is a property of the world itself',
  pic:G({a:[0,0,'work & duties','past'], b:[0,1,'war, inequality','past'], c:[0,2,'no God to rely on','past'],
         w:[1.3,1,'The world\n= complicated','bad',170]}, [['a','w'],['b','w'],['c','w']])},
 {who:'P', tag:'counter', say:'The world is simple. You are the one making it complicated.',
  f:'complicated ∈ your world Wₚ,  not ∈ the world W',
  pic:G({w:[0,0,'The world','past'], m:[1,0,'Your meaning\nMₚ','me'], y:[2,0,'Your world Wₚ\n“complicated”','act',170]},
        [['w','m'],['m','y']])},
 {who:'P', tag:'example', say:'Well water is 60°F all year. In summer it feels cool; in winter it feels warm.',
  f:'same fact, different felt value  ⇒  felt = f(fact, observer)',
  pic:G({f:[0,1,'Well water\n60°F (fixed)','past'], s:[1,0,'Summer you','me'], wi:[1,2,'Winter you','me'],
         c:[2,0,'feels cool','act'], h:[2,2,'feels warm','act']}, [['f','s'],['f','wi'],['s','c'],['wi','h']])},
 {who:'P', tag:'refutes “illusion”', say:'It is not an illusion. For you, in that moment, the coolness is a real fact.',
  f:'objective value (D1) and subjective value (D2) are both real; they live in different places',
  pic:tb(['', 'Objective', 'Subjective'], [['What','60°F','cool / warm'],['Same for everyone?','✓','✗'],['Real for you?','✓','✓']])},
 {who:'P', tag:'key idea', say:'There’s no escape from your subjectivity. The issue isn’t how the world is, but how YOU are. If you change, the world will look simpler.',
  f:'world fixed, you change ⇒ Wₚ changes   (T1)',
  pic:G({y:[0,0,'You change','me'], w:[1.3,0,'Your world\nlooks simpler','act']}, [['y','w']])},
 {who:'P', tag:'image', say:'It’s like wearing dark glasses. Don’t blame the world — take the glasses off. That takes courage.',
  f:'change the lens, not the world',
  pic:G({w1:[0,0,'The world','past'], g1:[1,0,'dark glasses','me'], d:[2,0,'looks dark','bad'],
         w2:[0,1,'The world','past'], g2:[1,1,'no glasses','me'], b:[2,1,'looks bright','act']},
        [['w1','g1'],['g1','d'],['w2','g2','courage'],['g2','b']])},
 {who:'P', tag:'thesis on trial', say:'People can change — everyone, no exceptions. And everyone can be happy. The Youth says: impossible.',
  f:'claims to defend: “people can change”, “everyone can be happy”',
  pic:G({c1:[0,0,'People can change','goal'], c2:[0,1,'Everyone can\nbe happy','goal'], y:[1.4,0.5,'Youth:\n“they can’t”','bad',160]},
        [['y','c1','attacks','x'],['y','c2','','x']])},
 {who:'Y', tag:'confession', say:'People can’t change — I know, because I’m suffering from not being able to change myself. And yet I wish I could.',
  f:'wish(change) ∧ ¬changed  → the debate begins (§1.2)',
  pic:G({w:[0,0,'Wishes to change','me'], n:[1.4,0,'Can’t (he thinks)','bad']}, [['w','n','but']])},
],
proofs:{T1:[
 ['Same well water (60°F) feels cool in summer, warm in winter.','observation'],
 ['So what is felt depends on the observer, not only on the fact.','from 1'],
 ['Each person lives only in their own world Wₚ.','A1'],
 ['“Complicated” is something felt, so it is a property of Wₚ.','2, 3'],
 ['Wₚ is built from p’s meaning, so if p’s meaning changes, Wₚ can change.','D2'],
 ['∴ How complicated the world feels can change when you change.','4, 5'],
]},
notes:{T1:'Whether a person CAN change is still open here — it becomes A4 in §1.5.'},
essence:[
  ['Y','The world is complicated: only a protected child could call it simple.'],
  ['P','Same 60°F water feels cool or warm: what you experience depends on you, not only on the world.'],
  ['P','So “complicated” lives in your subjective world, and changes when you change.'],
  ['P','Changing means taking off the dark glasses — which takes courage.'],
  ['T','T1: the world isn’t complicated; your view is. Claims on trial: people can change, everyone can be happy.']],
take:'The world isn’t complicated. Your view of it is — and a view can change.'});
</script>
