page({id:'2.3', uses:['D1','A1','A3','A10'], new:['D15','A11','T13'],

 {who:'P', tag:'definition', say:'Adler’s German word: Minder-wertigkeits-gefühl = a feeling of having less worth. It’s a VALUE judgment.',

 {who:'P', tag:'example', say:'I’m 61 inches tall. I used to think a few more inches would make life better. A friend said: “You put people at ease.”',

        [['h','o','before'],['h','n','after']])},
 {who:'P', tag:'key idea', say:'61 inches isn’t inferior. It became “short” only by comparing with others. Objective fact, subjective inferiority.',

 {who:'P', tag:'link', say:'We can’t alter objective facts. Subjective interpretations can be altered as much as we like — remember the 60°F well water.',

        [['d','w'],['d','a']])},
 {who:'P', tag:'proves', say:'So feelings of inferiority are interpretations — and subjectivity has one gift: you get to choose.',

],
proofs:{T13:[
 ['Height (61 in) is an objective fact.','D1'],
 ['A feeling of inferiority is a judgment about value.','D15'],

 ['So “inferior” is not a property of the fact; it is a meaning added to it.','1–3'],
 ['The person gives that meaning.','A3'],
 ['∴ A feeling of inferiority is a chosen interpretation and can be re-chosen.','4, 5'],
]},
essence:[

  ['P','Facts are fixed; interpretations aren’t. And value only exists among people: alone, a dollar is fuel (A11).'],
