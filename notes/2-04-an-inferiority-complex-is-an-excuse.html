<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Inferiority Complex Is an Excuse</title><link rel="stylesheet" href="style.css"><script src="defs.js"></script><script src="kit.js"></script>
<body><script>
page({id:'2.4', uses:['D15','T2','A2','A9','D12'], new:['D16','D17','D18','T14'],
moves:[
 {who:'Y', tag:'question', say:'Even the rich, the beautiful, gold medalists feel inferior. Why does everyone have it?',
  pic:G({r:[0,0,'rich','x'], b:[1,0,'beautiful','x'], g:[2,0,'gold medalist','x'], f:[1,1,'all feel inferior','bad']},
        [['r','f'],['b','f'],['g','f']])},
 {who:'P', tag:'definition', say:'We’re born helpless and all want to get better. Adler calls this the pursuit of superiority — a toddler learning to stand.',
  f:'D16: helpless → wish to improve',
  pic:G({h:[0,0,'Helpless','past'], i:[1.3,0,'Ideal','goal']}, [['h','i','pursuit of\nsuperiority']])},
 {who:'P', tag:'example', say:'Great chefs feel inferior all the time: “not good enough yet, next level.” Adler: not a disease — a stimulant for growth.',
  pic:G({c:[0,0,'Chef: “not good\nenough yet”','me'], g:[1.4,0,'Keeps improving','act']}, [['c','g','drives']])},
 {who:'P', tag:'key idea', say:'The feeling of inferiority is the gap between where you are and your ideal. It’s a launch pad, not a disease.',
  f:'feeling of inferiority = ideal − current   (healthy)',
  pic:G({i:[0,0,'Ideal self','goal'], c:[0,1.2,'Current self','me'], s:[1.4,0.6,'Strive, grow','act']},
        [['c','i','gap = feeling\nof inferiority'],['c','s','fuel']])},
 {who:'P', tag:'warning', say:'Don’t mix up the words. “Complex” originally means an abnormal mental state (like Freud’s Oedipus complex). A feeling of inferiority is normal.',
  pic:tb(['Term', 'Normal?'], [['Feeling of inferiority','✓ everyone has it'],['“Complex”','✗ abnormal state']])},
 {who:'P', tag:'definition', say:'The inferiority complex is different: USING the feeling as an excuse. “I’m not educated, so I can’t succeed.”',
  f:'D17: “I have A, so I can’t B”',
  pic:G({f:[0,0.5,'Feeling of\ninferiority','me'], s:[1.4,0,'Strive','act'], x:[1.4,1,'Excuse:\n“A, so I can’t B”','bad',170]},
        [['f','s','healthy'],['f','x','complex']])},
 {who:'Y', tag:'objection', say:'That’s real cause and effect! Without education you really do have fewer chances.',
  f:'¬educated ⇒ ¬success ?',
  pic:G({a:[0,0,'Not educated','past'], b:[1.3,0,'Can’t succeed','bad']}, [['a','b','causes?']])},
 {who:'P', tag:'refutes', say:'Adler calls it apparent cause and effect. Like “my parents divorced, so I can’t marry” — you see a link that isn’t there.',
  f:'∃ uneducated & successful ⇒ A ⇏ ¬B   (same shape as T2)   D18',
  pic:V({a:'not educated', b:'can’t succeed', ka:'past', kb:'bad', pts:[['x: uneducated,\nsucceeds','a']]})},
 {who:'Y', tag:'objection', say:'But in reality, education DOES make success easier!  P: The real issue is how you confront that reality.',
  pic:G({r:[0,0,'Reality: education\nhelps','past',170], c:[1.5,0,'Your response\nto it','me']}, [['r','c','what matters']])},
 {who:'P', tag:'translation', say:'So don’t say “I can’t succeed”. Say “I don’t want to” — because stepping forward is scary and effort costs your free time.',
  f:'“can’t B” → “won’t B”   (T14)',
  pic:G({c:[0,0,'“I can’t”','bad'], w:[1.3,0,'“I don’t want to”','me',170], r:[2.6,0,'fear of trying\n+ effort','goal']},
        [['c','w','honest\nversion'],['w','r','because']])},
],
proofs:{T14:[
 ['Some people with A (no education) do achieve B (success).','observation'],
 ['So A does not force “can’t B”: the link is only apparent.','1, D18'],
 ['The statement “A, so I can’t B” still serves a goal.','A2'],
 ['Its predictable effect: you never have to try B, so you never risk failing.','A9'],
 ['∴ “I can’t B” is better read as “I don’t want to try B”.','2–4'],
]},
essence:[
  ['Y','Even the successful feel inferior — why?'],
  ['P','We’re born helpless and all want to improve (D16); the gap to our ideal is the feeling of inferiority — healthy fuel.'],
  ['P','Using that feeling as an excuse — “A, so I can’t B” — is the inferiority complex (D17).'],
  ['Y','That’s real causation!'],
  ['P','Apparent cause and effect (D18): others with A do B. The truth is “I don’t want to risk trying.”'],
  ['T','T14: “I can’t” means “I won’t”.']],
take:'Inferiority feeling = fuel to grow. Inferiority complex = the same feeling used as an excuse.'});
</script>
