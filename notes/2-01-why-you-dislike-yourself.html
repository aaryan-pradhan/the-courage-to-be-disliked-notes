<title>Why You Dislike Yourself</title><link rel="stylesheet" href="style.css"><script src="defs.js"></script><script src="kit.js"></script>
<body><script>
page({id:'2.1', uses:['A2','D13','T9'], new:['A9','T12'],
moves:[
 {who:'Y', tag:'objection', say:'I dislike myself. What possible goal could that serve? There’s nothing to gain.',
  f:'A2 says every state serves a goal — so which goal?',
  pic:G({d:[0,0,'Dislike myself','me'], g:[1.3,0,'Goal = ?','goal']}, [['d','g','serves?']])},
 {who:'P', tag:'claim', say:'You see only your shortcomings BECAUSE you decided not to like yourself. The goal comes first.',
  f:'goal(don’t like self) ⇒ look only at flaws',
  pic:G({g:[0,0,'Decision:\ndon’t like myself','goal'], f:[1.3,0,'See only\nshortcomings','me']}, [['g','f']])},
 {who:'Y', tag:'evidence', say:'My flaws? No confidence, pessimistic, self-conscious, distrustful, theatrical — and my face and body too.',
  pic:G({a:[0,0,'no confidence','bad'], b:[1,0,'pessimistic','bad'], c:[2,0,'self-conscious','bad'], d:[0.5,1,'distrustful','bad'], e:[1.5,1,'face, body','bad']})},
 {who:'P', tag:'clue', say:'And listing them puts you in what mood?  Y: “Unpleasant. Nobody would want to get involved with someone as warped as me.”  P: “That settles it.”',
  f:'effect of the list = nobody gets involved ⇒ that is the goal (A9)',
  pic:G({l:[0,0,'List my flaws','me'], n:[1.4,0,'“Nobody would want\nto get close to me”','goal',180]}, [['l','n','effect']])},
 {who:'P', tag:'example', say:'A student wanted to be cured of blushing — so she could confess to a man. “Easy to cure,” I said. “But I won’t.”',
  pic:G({b:[0,0,'Fear of blushing','me'], c:[1.3,0,'Cure it','x'], k:[2.6,0,'Then confess\nto him','goal']}, [['b','c'],['c','k','plan']])},
 {who:'P', tag:'reading', say:'Her worst fear was rejection. Blushing let her keep “if only I didn’t blush, I could…” — and never risk the answer.',
  f:'blushing ⇒ “if only…” stays alive (D13) ⇒ no rejection risk',
  pic:G({r:[0,0,'Fear:\nrejection','bad'], b:[1,0,'Keep blushing','me'], i:[2,0,'“If only I didn’t\nblush…” (D13)','goal',170]}, [['r','b'],['b','i']])},
 {who:'Y', tag:'reframe', say:'So she made the blushing as an excuse — or as insurance in case he rejected her.  P: You could put it that way.',
  pic:G({b:[0,0,'Blushing','me'], i:[1.4,0,'Insurance against\nrejection','goal',170]}, [['b','i']])},
 {who:'P', tag:'refusal', say:'“If I cured it and nothing else changed, you’d come back saying ‘give me back my blushing.’”',
  pic:G({c:[0,0,'Cured','x'], s:[1,0,'Situation\nunchanged','x'], b:[2,0,'“Give it\nback!”','bad']}, [['c','s'],['s','b']])},
 {who:'P', tag:'pattern', say:'Same with “if I pass the exam, life will be rosy” or “if I get transferred, all will go well”. Wishes come true, and often nothing changes.',
  pic:tb(['“If only…”', 'Granted?', 'Life changed?'], [['blushing cured','✓','✗'],['exam passed','✓','✗ often'],['transferred','✓','✗ often']])},
 {who:'P', tag:'method', say:'So a counselor must not cure the symptom. Instead: help her accept “myself now”, and find courage to step forward whatever the outcome. That is encouragement.',
  pic:G({a:[0,0,'Accept\n“myself now”','me'], c:[1.3,0,'Courage to\nstep forward','act'], o:[2.6,0,'Whatever the\noutcome','x']}, [['a','c'],['c','o']])},
 {who:'P', tag:'outcome', say:'She joined a group of friends with him — and in the end HE confessed to her. She never came back; she probably didn’t need the blushing any more.',
  pic:G({s:[0,0,'Step forward','act'], c:[1.3,0,'He confessed','act'], b:[2.6,0,'Blushing:\nno longer needed','x']}, [['s','c'],['c','b']])},
 {who:'P', tag:'method', say:'How do I know her goal? Look at what the symptom reliably gets her. That effect IS the goal.',
  f:'goal(behavior) = its predictable, repeated effect   (A9, hidden in book)',
  pic:G({b:[0,0,'Behavior','me'], e:[1.3,0,'Predictable effect','act'], g:[2.6,0,'= the goal','goal']}, [['b','e'],['e','g','read as']])},
 {who:'P', tag:'proves', say:'Same with you. Disliking yourself keeps you out of relationships — so you can’t be hurt, and you have an excuse ready.',
  f:'A2 ∧ A9 ⇒ T12',
  pic:G({d:[0,0,'Dislike myself','me'], a:[1,0,'Avoid people','me'], h:[2,0,'Never get hurt','goal'],
         x:[1,1,'Ready excuse:\n“it’s my flaws”','goal']}, [['d','a'],['a','h'],['d','x']])},
 {who:'Y', tag:'admits', say:'Ouch. Yes — I’m afraid. I don’t want to get hurt by people. I’m terrified of being snubbed for who I am.',
  pic:G({f:[0,0,'Fear of being\nsnubbed','bad'], a:[1.4,0,'Admitted','act']}, [['f','a']])},
 {who:'P', tag:'but', say:'You can’t avoid hurt in relationships. Adler: “To get rid of one’s problems, one would have to live alone in the universe.”',
  pic:G({p:[0,0,'Relationships','x'], h:[1.3,0,'some hurt,\nalways','bad'], u:[0,1,'Alone in\nthe universe','x'], n:[1.3,1,'impossible','bad']},
        [['p','h'],['u','n']])},
],
proofs:{T12:[
 ['Every behavior and state serves a present goal.','A2'],
 ['The goal is the predictable effect the person keeps getting.','A9'],
 ['Disliking yourself predictably keeps you out of relationships, so nobody can hurt you, and gives you an excuse when snubbed.','observation'],
 ['∴ Self-dislike serves the goal of not getting hurt by others.','1–3'],
]},
notes:{T12:'A9 is the rule the Philosopher uses all night but never states. Without it, A2 says “some goal” but not WHICH goal.'},
essence:[
  ['Y','I dislike myself — what goal could that possibly serve?'],
  ['P','Listing your flaws ends in “nobody would want me” — that effect is the goal (A9).'],
  ['P','Like the blushing student: the symptom kept “if only…” alive and shielded her from rejection.'],
  ['P','Curing the symptom changes nothing; encouragement — accept yourself, then step forward — does.'],
  ['T','T12: self-dislike serves the goal of never getting hurt by others. But hurt-free relationships don’t exist.']],
take:'You don’t dislike yourself and therefore avoid people. You avoid people, and dislike yourself to make it possible.'});
</script>
