<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why People Can Change</title><link rel="stylesheet" href="style.css"><script src="defs.js"></script><script src="kit.js"></script>
<body><script>
page({id:'1.2', uses:['D1','D2'], new:['D4','D5','D6','A2','T2'],
moves:[
 {who:'Y', tag:'objection', say:'Everyone wishes to change. That proves they can’t — if it were easy, nobody would need to wish.',
  f:'Wish(change) ⇒ ¬Can(change) ?',
  chk:'invalid. Wishing shows you have not changed YET. It says nothing about whether you CAN.',
  pic:G({w:[0,0,'wishes to change','x'], n:[1.3,0,'has not changed\nyet','act'], c:[1.3,1,'cannot change','bad']},
        [['w','n','✓ follows'],['w','c','does not follow','x']])},
 {who:'Y', tag:'example', say:'My friend hasn’t left his room in years. Go outside and he panics. Something in his past must cause it.',
  f:'past cause ⇒ present behavior   (etiology, D4)',
  pic:G({p:[0,0,'Past:\nabuse / bullying','past'], b:[1.4,0,'Stays in his room','act']}, [['p','b','causes']])},
 {who:'Y', tag:'probe', say:'I don’t know his past — bad parents, bullying, or the opposite, too pampered. But before an effect there’s always a cause.',
  f:'∀ effect ∃ past cause',
  pic:G({a:[0,0,'abused?','past'], b:[0,1,'bullied?','past'], c:[0,2,'pampered?','past'], e:[1.3,1,'Stays in','act']}, [['a','e'],['b','e'],['c','e']])},
 {who:'P', tag:'test', say:'If the past decided the present, then everyone abused as a child would become a recluse.',
  f:'etiology ⇒ A ⊆ R    (A = abused, R = recluses)',
  pic:V({a:'abused (A)', b:'recluses (R)', mode:'subset', cap:'claim: every A is inside R'})},
 {who:'P', tag:'refutes', say:'But that isn’t so. Plenty of abused people go out and live full lives.',
  f:'∃x: x ∈ A ∧ x ∉ R   ⇒   A ⊄ R   ⇒   T2',
  pic:V({a:'abused (A)', b:'recluses (R)', pts:[['x: abused,\nnot recluse','a']], cap:'one x outside R breaks “A ⊆ R”'})},
 {who:'P', tag:'warning', say:'Explaining everything by past causes is determinism: your present and future are already fixed.',
  f:'D6: past fixes present fixes future',
  pic:G({a:[0,0,'Past 🔒','past'], b:[1,0,'Present 🔒','past'], c:[2,0,'Future 🔒','past']}, [['a','b','fixes'],['b','c','fixes']])},
 {who:'Y', tag:'objection', say:'So the past doesn’t matter? Then there’s no reason he can’t go out! There MUST be a reason, or nothing explains it.',
  f:'¬cause ⇒ ¬explanation ?',
  pic:G({p:[0,0,'Past doesn’t\nmatter','x'], n:[1.4,0,'No explanation\nat all?','bad']}, [['p','n','?']])},
 {who:'P', tag:'answer', say:'Right — causes explain nothing here. So Adler looks not at past causes but at present goals.',
  pic:G({c:[0,0,'Past causes','past'], g:[1.4,0,'Present goals','goal']}, [['c','g','look here instead']])},
 {who:'P', tag:'flip', say:'He doesn’t stay in because of anxiety. He wants to stay in, so he creates the anxiety. That’s teleology.',
  f:'etiology: anxiety ⇒ stay in      teleology: goal(stay in) ⇒ create anxiety (D5)',
  pic:G({l1:[-0.75,0,'Etiology','lbl'], a1:[0,0,'Anxiety','past'], b1:[1,0,'Can’t go out','act'],
         l2:[-0.75,1,'Teleology','lbl'], g:[0,1,'Goal:\nnot go out','goal'], a2:[1,1,'Creates anxiety','me'], b2:[2,1,'Stays in','act']},
        [['a1','b1'],['g','a2'],['a2','b2']])},
 {who:'P', tag:'clarifies', say:'He isn’t faking. The anxiety — even headaches, cramps — is real. But it serves the goal.',
  f:'anxiety is real  ∧  anxiety is a means to the goal   (A2)',
  pic:G({a:[0,0,'Anxiety\nreal ✓','me'], g:[1.3,0,'serves goal:\nnot go out','goal']}, [['a','g']])},
 {who:'P', tag:'verdict', say:'Everything you’ve said is etiology. As long as we stay in etiology, we won’t take a single step forward.',
  pic:G({e:[0,0,'Etiology','past'], s:[1.4,0,'No step forward','bad']}, [['e','s']])},
],
proofs:{T2:[
 ['Strict etiology says: abused ⇒ recluse, for everyone. In sets: A ⊆ R.','D4'],
 ['Observed: some x is abused but not a recluse (x ∈ A, x ∉ R).','observation'],
 ['∴ A ⊄ R. The past event alone does not fix the behavior.','1, 2'],
]},
notes:{T2:'T2 only says the past is not SUFFICIENT. That behavior is driven by goals is a separate claim: A2.'},
essence:[
  ['Y','Everyone wishes to change, so no one can. My friend can’t leave his room because of his past.'],
  ['P','If the past decided, every abused person would be a recluse (A ⊆ R). One counterexample breaks it.'],
  ['Y','Then nothing explains his seclusion!'],
  ['P','A goal does: he doesn’t want to go out, so he creates anxiety — real anxiety, serving the goal.'],
  ['T','T2: the past is not sufficient. A2: behavior is a means to a present goal (teleology, D5).']],
take:'A past event doesn’t fix what you do (T2). Adler explains behavior by goals, not causes (A2).'});
</script>
